name: Release

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Resolve version/tag
        id: meta
        run: |
          version="$(node -p 'require("./package.json").version' | tr -d '\n')"
          node scripts/extract-changelog.mjs --version "${version}" --validate-version >/dev/null
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            if [[ "${tag}" != "v${version}" ]]; then
              echo "Tag ${tag} does not match package.json version v${version}" >&2
              exit 1
            fi
            tag_exists="false"
          else
            tag="v${version}"
            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
              tag_exists="true"
            else
              tag_exists="false"
            fi
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "tag_exists=${tag_exists}" >> "$GITHUB_OUTPUT"

      - name: Create version tag
        if: startsWith(github.ref, 'refs/heads/') && steps.meta.outputs.tag_exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.meta.outputs.tag }}" "${GITHUB_SHA}"
          git push origin "${{ steps.meta.outputs.tag }}"

      - name: Install
        run: npm ci

      - name: Fetch pinned legacy reference & Run checks
        run: |
          npm run legacy:fetch
          npm run check

      - name: Build
        run: npm run build
        env:
          AUTOFEED_USERSCRIPT_URL: https://github.com/Gawain12/auto_feed_js/releases/latest/download/auto_feed.user.js

      - name: Extract release notes
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: |
          node scripts/extract-changelog.mjs --version "${{ steps.meta.outputs.version }}" --out /tmp/release-notes.md

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Auto-Feed ${{ steps.meta.outputs.tag }}
          body_path: /tmp/release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/auto_feed.user.js

      - name: Publish GreasyFork sync branch with changelog
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          worktree_dir="/tmp/greasyfork-branch"
          rm -rf "${worktree_dir}"

          if git ls-remote --exit-code --heads origin greasyfork >/dev/null 2>&1; then
            git fetch origin greasyfork:refs/remotes/origin/greasyfork
            git worktree add -B greasyfork "${worktree_dir}" origin/greasyfork
          else
            git worktree add --orphan -b greasyfork "${worktree_dir}"
          fi

          cp dist/auto_feed.user.js "${worktree_dir}/auto_feed.user.js"

          {
            echo "v${{ steps.meta.outputs.version }}"
            echo ""
            cat /tmp/release-notes.md
          } > /tmp/greasyfork-commit-msg.txt

          cd "${worktree_dir}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add auto_feed.user.js

          if git diff --cached --quiet; then
            echo "No userscript changes for greasyfork branch; skipping push."
          else
            git commit -F /tmp/greasyfork-commit-msg.txt
            git push origin greasyfork
          fi
